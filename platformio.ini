# PlatformIO Project Configuration File

[platformio]
default_envs = debug 
src_dir = Src
include_dir = Inc

[env]
platform = ststm32@20.0.0
board = stm32c011f4p6_custom
framework = stm32cube

board_build.mcu = stm32c011f4p6
board_build.product_line = STM32C011xx
board_build.extra_flags = -DSTM32C0 -DSTM32C011xx

board_build.stm32cube.custom_system_setup = yes
board_build.ldscript = $PROJECT_DIR/STM32C011F4PX_FLASH.ld

upload_protocol = stlink
debug_tool = stlink

; The local board manifest loads target/stm32c0x.cfg directly. Unlike the
; Nucleo board script, it does not force hardware SRST, so OpenOCD uses
; Cortex-M SYSRESETREQ when NRST is not connected.

# all build envs use these
extra_scripts =
    scripts/run_formatter.py # adds format custom targets

# customize source file inclusion/exclusion
build_src_filter =
    # start by including everything
    +<*> -<.git/> -<.svn/>
    # same for rocketlib
    -<third_party/rocketlib/**>
    +<third_party/rocketlib/common/**>

# build settings common to all build types
build_flags = 
	-DSTM32C011xx
    -mfloat-abi=soft
    -Iinc
    -Isrc/third_party/rocketlib/include
    -Isrc/third_party

# build settings unique to release build (full optimization, etc)
[env:release]
build_flags =
    ${env.build_flags}

# build for debugger
[env:debug]
build_type = debug

build_flags =
    ${env.build_flags}
    -DDEBUG
    -Og
    -g3

[env:diagnostic]
build_type = release
build_flags =
    ${env.build_flags}
    -g3
    -DDEBUG
    -Os
